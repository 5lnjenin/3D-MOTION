name: Apple validation

on:
  push:
    paths:
      - '24.zip'
      - '.github/workflows/apple-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Apple project and select iPad simulator
        shell: bash
        run: |
          set -euo pipefail
          unzip -q 24.zip -d "$RUNNER_TEMP/Motion24"
          export MOTION_PROJECT_FOLDER="$RUNNER_TEMP/Motion24/3DMOTION24.swiftpm"
          printf 'MOTION_PROJECT_FOLDER=%s\n' "$MOTION_PROJECT_FOLDER" >> "$GITHUB_ENV"
          python3 "$MOTION_PROJECT_FOLDER/Tests/create_apple_project.py"
          xcodebuild -version
          xcrun simctl list devices available --json > "$RUNNER_TEMP/motion-simulators.json"
          python3 - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP'] + '/motion-simulators.json') as source:
              devices = json.load(source)['devices']
          candidates = [device for runtime, items in devices.items() if '.iOS-' in runtime
                        for device in items if device.get('isAvailable') and device['name'].startswith('iPad')]
          if not candidates:
              raise SystemExit('No available iPad simulator on this runner')
          selected = candidates[0]
          with open(os.environ['GITHUB_ENV'], 'a') as target:
              target.write('MOTION_IOS_UDID=' + selected['udid'] + '\n')
          print('Selected simulator:', selected['name'], selected['udid'])
          PY
      - name: Build the full app and hosted XCTest target
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project "$MOTION_PROJECT_FOLDER/Tests/AppleValidation.xcodeproj" \
            -scheme MotionValidation \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$MOTION_IOS_UDID" \
            -derivedDataPath "$RUNNER_TEMP/Motion24DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/motion-build.xcresult" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build-for-testing 2>&1 | tee "$RUNNER_TEMP/motion-build.log"
      - name: Check the actual simulator app bundle
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, plistlib
          products = pathlib.Path(os.environ['RUNNER_TEMP']) / 'Motion24DerivedData/Build/Products'
          app = products / 'Debug-iphonesimulator/MotionValidation.app'
          info = app / 'Info.plist'
          if not info.exists():
              print('::error::Expected simulator app Info.plist is absent; actual product plist files: ' + ', '.join(str(p) for p in products.rglob('Info.plist')))
              raise SystemExit(1)
          with info.open('rb') as source:
              properties = plistlib.load(source)
          print('::notice::Actual simulator app bundle: ' + str(properties))
          assert properties.get('CFBundleIdentifier') == 'app.5ln.studio.validation'
          assert (app / properties['CFBundleExecutable']).is_file()
          PY
      - name: Run SceneKit persistence tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project "$MOTION_PROJECT_FOLDER/Tests/AppleValidation.xcodeproj" \
            -scheme MotionValidation \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$MOTION_IOS_UDID" \
            -derivedDataPath "$RUNNER_TEMP/Motion24DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/motion-tests.xcresult" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test-without-building 2>&1 | tee "$RUNNER_TEMP/motion-tests.log"
      - name: Verify ad-hoc signing of the simulator app on macOS
        shell: bash
        run: |
          set -euo pipefail
          MOTION_SIM_APP="$RUNNER_TEMP/Motion24DerivedData/Build/Products/Debug-iphonesimulator/MotionValidation.app"
          {
            codesign --force --deep --sign - --timestamp=none "$MOTION_SIM_APP"
            codesign --verify --deep --strict --verbose=2 "$MOTION_SIM_APP"
            echo 'MACOS SIMULATOR AD-HOC SIGNING VERIFIED; iPad Playgrounds signing is a separate check.'
          } 2>&1 | tee "$RUNNER_TEMP/motion-signing.log"
      - name: Publish actual compiler and XCTest diagnostics
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess
          print('::notice::Apple toolchain: ' + subprocess.check_output(['xcodebuild', '-version'], text=True).strip().replace('\n', '; '))
          # GitHub limits annotation counts per step. Group all export rows
          # into one notice so every resolution/FPS result stays reviewable.
          evidence_path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'motion-tests.log'
          if evidence_path.exists():
              evidence = evidence_path.read_text(errors='replace')
              rows = list(dict.fromkeys(re.findall(r'EXPORT_MATRIX_(?:PASS|FAIL)[^\n]+', evidence)))
              filters = list(dict.fromkeys(re.findall(r'(?:EXPORT_(?:FILTER|STRENGTH)|PBR_EXPORT|PHOTOS_COPY|LONG_EXPORT|HDR_COLOR)_PASS[^\n]+', evidence)))
              totals = list(dict.fromkeys(re.findall(r'Executed \d+ tests[^\n]+', evidence)))
              summary = '\n'.join(['Actual export and XCTest evidence:'] + totals + rows + filters)
              print('::notice::' + summary.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
              failures = list(dict.fromkeys(line for line in evidence.splitlines() if 'error:' in line or ('Test Case' in line and 'failed' in line)))
              if failures:
                  print('::error::' + ('All test failures:\n' + '\n'.join(failures)).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          seen = set()
          for name in ('motion-build.log', 'motion-tests.log', 'motion-signing.log'):
              path = pathlib.Path(os.environ['RUNNER_TEMP']) / name
              if not path.exists():
                  continue
              log_text = path.read_text(errors='replace')
              if name in ('motion-build.log', 'motion-tests.log') and 'SUCCEEDED **' not in log_text:
                  tail = 'Actual Apple log tail (' + name + '):\n' + log_text[-3500:]
                  print('::error::' + tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
              for line in log_text.splitlines():
                  if 'error:' in line or ('Test Case' in line and 'failed' in line):
                      kind = 'error'
                  elif any(term in line for term in ('Testing failed:', 'Early unexpected exit', 'Failed to', 'could not be loaded', 'failed to start', 'test runner failed')):
                      kind = 'error'
                  elif re.search(r'Executed \d+ tests?', line) or '** BUILD' in line or '** TEST' in line or 'MACOS SIMULATOR AD-HOC SIGNING VERIFIED' in line or 'EXPORT_MATRIX_PASS' in line or 'EXPORT_FILTER_PASS' in line:
                      kind = 'notice'
                  else:
                      continue
                  if line in seen:
                      continue
                  seen.add(line)
                  escaped = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::' + kind + '::' + escaped)
          import json
          for name in ('motion-build.xcresult', 'motion-tests.xcresult'):
              path = pathlib.Path(os.environ['RUNNER_TEMP']) / name
              if not path.exists():
                  continue
              result = subprocess.run(['xcrun', 'xcresulttool', 'get', '--path', str(path), '--format', 'json'], capture_output=True, text=True)
              if result.returncode:
                  print('::warning::xcresulttool: ' + result.stderr.strip().replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
                  continue
              document = json.loads(result.stdout)
              def inspect(value):
                  if isinstance(value, dict):
                      for key in ('errorSummaries', 'testFailureSummaries'):
                          for issue in value.get(key, {}).get('_values', []):
                              message = issue.get('message', {}).get('_value', '')
                              test = issue.get('testCaseName', {}).get('_value', '')
                              text = (test + ': ' if test else '') + message
                              if text and text not in seen:
                                  seen.add(text)
                                  print('::error::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
                      for key, child in value.items():
                          inspect(child)
                  elif isinstance(value, list):
                      for child in value:
                          inspect(child)
              inspect(document)
              references = []
              def diagnostic_ids(value):
                  if isinstance(value, dict):
                      if 'diagnosticsRef' in value:
                          identifier = value['diagnosticsRef'].get('id', {}).get('_value')
                          if identifier and identifier not in references:
                              references.append(identifier)
                      for child in value.values():
                          diagnostic_ids(child)
                  elif isinstance(value, list):
                      for child in value:
                          diagnostic_ids(child)
              diagnostic_ids(document)
              for index, identifier in enumerate(references):
                  directory = pathlib.Path(os.environ['RUNNER_TEMP']) / ('motion-diagnostics-' + str(index))
                  exported = subprocess.run(['xcrun', 'xcresulttool', 'export', '--path', str(path), '--id', identifier,
                                             '--type', 'directory', '--output-path', str(directory)], capture_output=True, text=True)
                  if exported.returncode:
                      continue
                  for report in list(directory.rglob('*.crash')) + list(directory.rglob('*.ips')):
                      if 'MotionValidation' not in report.name:
                          continue
                      text = report.read_text(errors='replace')
                      try:
                          decoder = json.JSONDecoder()
                          header, end = decoder.raw_decode(text)
                          details, _ = decoder.raw_decode(text[end:].lstrip())
                          frames = []
                          for thread in details.get('threads', []):
                              if thread.get('triggered'):
                                  frames = [frame.get('symbol', str(frame)) for frame in thread.get('frames', [])[:18]]
                          excerpt = json.dumps(details.get('exception', {})) + '\n' + '\n'.join(frames)
                      except (ValueError, TypeError):
                          lines = text.splitlines()
                          position = next((i for i, line in enumerate(lines) if 'Crashed:' in line), 0)
                          excerpt = '\n'.join(lines[:12] + lines[position:position + 28])
                      print('::error::Actual crash ' + report.name + ': ' + excerpt[:3400].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
      - name: Upload actual Apple results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-validation-results
          path: |
            ${{ runner.temp }}/motion-build.log
            ${{ runner.temp }}/motion-tests.log
            ${{ runner.temp }}/motion-signing.log
            ${{ runner.temp }}/motion-build.xcresult
            ${{ runner.temp }}/motion-tests.xcresult
          if-no-files-found: warn
